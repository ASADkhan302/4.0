<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>University of Lakki Marwat — Central Campus Library</title>
    <meta name="description" content="Ultra-HD enterprise Windows 11 Fluent dark-mode Library Management System with barcode scanning, circulation desk, SQLite engine, C++20 architecture, and reports." />
    <meta property="og:title" content="University of Lakki Marwat — Central Campus Library" />
    <meta property="og:description" content="Ultra-HD enterprise Windows 11 Fluent dark-mode Library Management System with barcode scanning, circulation desk, SQLite engine, C++20 architecture, and reports." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="./image_0.png" />
    <link rel="apple-touch-icon" href="./image_0.png" />
    <style>
      html, body, #root { background-color: #f8fafc; margin: 0; padding: 0; overflow: hidden; height: 100%; width: 100%; }
    </style>
    <script>
      (function() {
        try {
          var themeRaw = localStorage.getItem('ulm_theme_config_v1');
          if (themeRaw) {
            var cfg = JSON.parse(themeRaw);
            if (cfg && cfg.themeMode === 'dark') {
              document.documentElement.classList.remove('light-theme');
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.add('light-theme');
              document.documentElement.classList.remove('dark');
            }
          } else {
            // Default: Soft White Light Theme
            document.documentElement.classList.add('light-theme');
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
    <style id="ulm-light-theme-engine">
      /* ============================================================================
         1. DESKTOP APP SHELL LOCK & VERTICAL SCROLL ENGINE (ALL 8 PAGES)
         ============================================================================ */
      html, body {
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important; /* Lock outer window frame like a native Windows 11 app */
      }

      #root {
        width: 100% !important;
        height: 100dvh !important;
        max-height: 100dvh !important;
        overflow: hidden !important;
        display: flex !important;
        flex-direction: column !important;
      }

      /* Master Scrollable Workspace View (Books Catalog, Almaris, Barcode, Circulation, etc.) */
      #ulm-main-scroll-view,
      .ulm-page-scroll-container {
        flex: 1 1 0% !important;
        min-height: 0 !important;
        min-width: 0 !important;
        height: 100% !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
        scroll-behavior: smooth !important;
        -webkit-overflow-scrolling: touch !important;
        overscroll-behavior-y: contain !important;
      }

      /* Custom Thin High-Contrast Scrollbar for Main Workspace & Modals */
      #ulm-main-scroll-view::-webkit-scrollbar,
      .ulm-page-scroll-container::-webkit-scrollbar,
      .ulm-modal-scroll::-webkit-scrollbar,
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px !important;
        height: 8px !important;
      }

      #ulm-main-scroll-view::-webkit-scrollbar-track,
      .ulm-page-scroll-container::-webkit-scrollbar-track,
      .ulm-modal-scroll::-webkit-scrollbar-track,
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.06) !important;
        border-radius: 9999px !important;
      }

      html.dark #ulm-main-scroll-view::-webkit-scrollbar-track,
      html.dark .ulm-page-scroll-container::-webkit-scrollbar-track,
      html.dark .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.04) !important;
      }

      #ulm-main-scroll-view::-webkit-scrollbar-thumb,
      .ulm-page-scroll-container::-webkit-scrollbar-thumb,
      .ulm-modal-scroll::-webkit-scrollbar-thumb,
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(84, 26, 114, 0.38) !important; /* ULM Royal Purple */
        border-radius: 9999px !important;
        border: 2px solid transparent !important;
        background-clip: padding-box !important;
      }

      #ulm-main-scroll-view::-webkit-scrollbar-thumb:hover,
      .ulm-page-scroll-container::-webkit-scrollbar-thumb:hover,
      .ulm-modal-scroll::-webkit-scrollbar-thumb:hover,
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(188, 136, 27, 0.85) !important; /* ULM 24K Gold on hover */
      }

      /* Ensure background watermarks & ambient orbs NEVER intercept mouse wheel scroll */
      #app-bg-watermark,
      #ulm-liquid-orbs,
      #ulm-eye-comfort-veil,
      .ulm-app-bg-watermark,
      div.fixed.inset-0.pointer-events-none {
        pointer-events: none !important;
        user-select: none !important;
      }

      /* ============================================================================
         2. HARDWARE BARCODE CONTRAST LOCK (PREVENTS BLACK BOX IN BARCODE STUDIO!)
         ============================================================================ */
      .ulm-barcode-safe-pad {
        background-color: #FFFFFF !important;
        background-image: none !important;
        color: #000000 !important;
        border: 1.5px solid #CBD5E1 !important;
        border-radius: 0.5rem !important;
        padding: 0.35rem 0.5rem !important;
      }
      .ulm-barcode-safe-pad svg {
        background-color: #FFFFFF !important;
        display: block !important;
      }
      .ulm-barcode-safe-pad svg rect[fill="#FFFFFF"] {
        fill: #FFFFFF !important;
      }
      .ulm-barcode-safe-pad svg rect[fill="#000000"] {
        fill: #000000 !important;
      }
      .ulm-barcode-safe-pad div,
      .ulm-barcode-safe-pad span {
        color: #000000 !important;
        background: transparent !important;
      }

      /* ============================================================================
         3. ENSURE ALL PAGES IN WHITE MODE ARE 100% SHARP & BRIGHT (FIXES ee.png)
         ============================================================================ */
      html.light-theme,
      html.light-theme body,
      html.light-theme #root {
        background-color: #F4F6FA !important;
        color: #0F172A !important;
        filter: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }

      /* Completely disable any full-screen dimmer veil or pointer-events-none blur overlay */
      #ulm-eye-comfort-veil,
      html.light-theme #ulm-eye-comfort-veil {
        display: none !important;
        opacity: 0 !important;
        background: transparent !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }

      html.light-theme .fixed.inset-0.pointer-events-none,
      html.light-theme [class*="fixed"][class*="inset-0"][class*="pointer-events-none"] {
        background-color: transparent !important;
        background-image: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        filter: none !important;
        box-shadow: none !important;
      }

      /* ============================================================================
         2. TRANSPARENT GLASS OPENING SPLASH SCREEN, LOGO & CONSOLE IN BOTH DARK & WHITE MODE
            (Fixes 001714.png — Removes gray square box on logo & solid white console box)
         ============================================================================ */
      /* 2A. Transparent Full-Screen Splash Backdrop */
      #ulm-boot-splash {
        background: radial-gradient(circle at 50% 35%, rgba(84, 26, 114, 0.28) 0%, rgba(7, 11, 20, 0.52) 100%) !important;
        backdrop-filter: blur(18px) saturate(180%) !important;
        -webkit-backdrop-filter: blur(18px) saturate(180%) !important;
      }
      html.light-theme #ulm-boot-splash {
        background: radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.45) 0%, rgba(241, 245, 249, 0.58) 100%) !important;
        backdrop-filter: blur(18px) saturate(180%) !important;
        -webkit-backdrop-filter: blur(18px) saturate(180%) !important;
      }

      /* 2B. Transparent ULM Crest Logo in Both Modes (Preserve 100% of sun rays, wreath & 2017 without circular clipping) */
      #ulm-boot-logo,
      html.light-theme #ulm-boot-logo {
        background: transparent !important;
        backdrop-filter: blur(12px) !important;
        -webkit-backdrop-filter: blur(12px) !important;
        border-radius: 1rem !important;
        border: 1px solid rgba(188, 136, 27, 0.40) !important;
        overflow: hidden !important;
        box-shadow: 0 12px 32px rgba(188, 136, 27, 0.20) !important;
      }
      #ulm-boot-logo img,
      html.light-theme #ulm-boot-logo img,
      header img[alt*="ULM"],
      header img[alt*="Crest"],
      header img[alt*="University"],
      .ulm-app-bg-watermark,
      .ulm-membercard-watermark {
        background: transparent !important;
        object-fit: contain !important;
        clip-path: none !important;
        border-radius: 0 !important;
        transform: none !important;
        pointer-events: none !important;
        user-select: none !important;
      }

      /* 2C. Transparent Frosted Glass Splash Card in Dark & White Mode */
      #ulm-boot-card {
        background: rgba(15, 23, 42, 0.42) !important;
        background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.03) 60%, rgba(188, 136, 27, 0.10) 100%) !important;
        backdrop-filter: blur(24px) saturate(200%) !important;
        -webkit-backdrop-filter: blur(24px) saturate(200%) !important;
        border: 1.5px solid rgba(255, 255, 255, 0.22) !important;
        box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.25) !important;
        color: #F8FAFC !important;
      }
      html.light-theme #ulm-boot-card {
        background: rgba(255, 255, 255, 0.48) !important;
        background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.25) 60%, rgba(188, 136, 27, 0.10) 100%) !important;
        backdrop-filter: blur(24px) saturate(200%) !important;
        -webkit-backdrop-filter: blur(24px) saturate(200%) !important;
        border: 1.5px solid rgba(255, 255, 255, 0.88) !important;
        box-shadow: 0 24px 54px -12px rgba(15, 23, 42, 0.14), inset 0 1.5px 1px rgba(255, 255, 255, 0.95) !important;
        color: #0F172A !important;
      }

      /* 2D. Transparent Glass Boot Terminal Console (Never a solid white rectangle!) */
      #ulm-boot-console {
        background: rgba(7, 11, 20, 0.38) !important;
        backdrop-filter: blur(12px) !important;
        -webkit-backdrop-filter: blur(12px) !important;
        border: 1px solid rgba(255, 255, 255, 0.14) !important;
        color: #34D399 !important;
      }
      html.light-theme #ulm-boot-console {
        background: rgba(15, 23, 42, 0.08) !important;
        backdrop-filter: blur(12px) !important;
        -webkit-backdrop-filter: blur(12px) !important;
        border: 1px solid rgba(15, 23, 42, 0.14) !important;
        color: #047857 !important;
      }
      html.light-theme #ulm-boot-console * {
        color: #1E293B !important;
      }
      html.light-theme #ulm-boot-console .text-emerald-400,
      html.light-theme #ulm-boot-console .text-green-400 {
        color: #047857 !important;
        font-weight: 700 !important;
      }

      /* ============================================================================
         3. MODAL BACKDROPS ONLY: DIM & BLUR ONLY WHEN AN INTERACTIVE MODAL IS OPEN
            (Fixes 033520.png & 033542.png without ever blurring regular pages!)
         ============================================================================ */
      html.light-theme .ulm-modal-backdrop:not(.pointer-events-none),
      html.light-theme div.fixed.inset-0.z-50.flex:not(.pointer-events-none),
      html.light-theme div.fixed.inset-0.z-\[60\].flex:not(.pointer-events-none),
      html.light-theme div.fixed.inset-0.z-\[70\].flex:not(.pointer-events-none),
      html.light-theme div.fixed.inset-0.z-\[80\].flex:not(.pointer-events-none),
      html.light-theme div.fixed.inset-0.z-\[90\].flex:not(.pointer-events-none),
      html.light-theme div.fixed.inset-0.z-\[100\].flex:not(.pointer-events-none):not(#ulm-boot-splash) {
        background-color: rgba(15, 23, 42, 0.42) !important;
        background-image: none !important;
        backdrop-filter: blur(4px) !important;
        -webkit-backdrop-filter: blur(4px) !important;
      }

      /* ============================================================================
         4. CONVERT ALL DARK CARDS/BANNERS/PANELS TO CRISP WHITE CARDS IN WHITE MODE
            (Excludes #ulm-boot-splash, #ulm-boot-card, #ulm-boot-console, .ulm-preserve-glass, and .ulm-preserve-dark)
         ============================================================================ */
      html.light-theme [class*="bg-[#0"]:not(.fixed.inset-0):not(.pointer-events-none):not(#ulm-boot-splash):not(#ulm-boot-card):not(#ulm-boot-console):not(.ulm-preserve-glass):not(.ulm-preserve-glass *):not(.ulm-preserve-dark):not(.ulm-preserve-dark *),
      html.light-theme [class*="bg-[#1"]:not(.fixed.inset-0):not(.pointer-events-none):not(#ulm-boot-splash):not(#ulm-boot-card):not(#ulm-boot-console):not(.ulm-preserve-glass):not(.ulm-preserve-glass *):not(.ulm-preserve-dark):not(.ulm-preserve-dark *),
      html.light-theme [class*="bg-[#2"]:not(.fixed.inset-0):not(.pointer-events-none):not(#ulm-boot-splash):not(#ulm-boot-card):not(#ulm-boot-console):not(.ulm-preserve-glass):not(.ulm-preserve-glass *):not(.ulm-preserve-dark):not(.ulm-preserve-dark *),
      html.light-theme [class*="bg-slate-9"]:not(.fixed.inset-0):not(.pointer-events-none):not(#ulm-boot-splash):not(#ulm-boot-card):not(#ulm-boot-console):not(.ulm-preserve-glass):not(.ulm-preserve-glass *):not(.ulm-preserve-dark):not(.ulm-preserve-dark *),
      html.light-theme [class*="bg-zinc-9"]:not(.fixed.inset-0):not(.pointer-events-none):not(#ulm-boot-splash):not(#ulm-boot-card):not(#ulm-boot-console):not(.ulm-preserve-glass):not(.ulm-preserve-glass *):not(.ulm-preserve-dark):not(.ulm-preserve-dark *),
      html.light-theme [class*="bg-neutral-9"]:not(.fixed.inset-0):not(.pointer-events-none):not(#ulm-boot-splash):not(#ulm-boot-card):not(#ulm-boot-console):not(.ulm-preserve-glass):not(.ulm-preserve-glass *):not(.ulm-preserve-dark):not(.ulm-preserve-dark *) {
        background-color: #FFFFFF !important;
        background-image: none !important;
        border-color: #E2E8F0 !important;
        color: #0F172A !important;
        box-shadow: 0 4px 18px -4px rgba(15, 23, 42, 0.06) !important;
      }

      /* Inner panels, Shelf Rack Inspector boxes, and table headers in Light Mode */
      html.light-theme [class*="bg-slate-8"]:not(.fixed):not(.ulm-preserve-dark):not(.ulm-preserve-dark *),
      html.light-theme [class*="bg-zinc-8"]:not(.fixed):not(.ulm-preserve-dark):not(.ulm-preserve-dark *) {
        background-color: #F1F5F9 !important;
        border-color: rgba(15, 23, 42, 0.14) !important;
        color: #0F172A !important;
      }

      /* Fix ALL white/light text classes on White Glass surfaces so nothing is invisible white-on-white */
      html.light-theme .text-white:not(.ulm-preserve-dark *):not([class*="bg-purple-"]):not([class*="bg-[#541A72]"]):not([class*="bg-emerald-6"]):not([class*="bg-rose-6"]):not([class*="bg-amber-6"]),
      html.light-theme .text-slate-50:not(.ulm-preserve-dark *),
      html.light-theme .text-slate-100:not(.ulm-preserve-dark *),
      html.light-theme .text-slate-200:not(.ulm-preserve-dark *),
      html.light-theme .text-zinc-100:not(.ulm-preserve-dark *),
      html.light-theme .text-zinc-200:not(.ulm-preserve-dark *) {
        color: #0F172A !important;
      }

      html.light-theme .text-slate-300:not(.ulm-preserve-dark *),
      html.light-theme .text-zinc-300:not(.ulm-preserve-dark *) {
        color: #1E293B !important;
      }

      html.light-theme .text-slate-400:not(.ulm-preserve-dark *),
      html.light-theme .text-slate-500:not(.ulm-preserve-dark *),
      html.light-theme .text-zinc-400:not(.ulm-preserve-dark *),
      html.light-theme .text-zinc-500:not(.ulm-preserve-dark *) {
        color: #475569 !important;
      }

      /* Unify ALL Form Inputs, Selects & Textareas in Light Mode */
      html.light-theme input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),
      html.light-theme select,
      html.light-theme textarea {
        background-color: #FFFFFF !important;
        color: #0F172A !important;
        border: 1.5px solid #CBD5E1 !important;
        box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.04) !important;
      }
      html.light-theme input::placeholder,
      html.light-theme textarea::placeholder {
        color: #64748B !important;
      }
      html.light-theme label {
        color: #1E293B !important;
        font-weight: 700 !important;
      }

      /* Protect Intentional Dark Previews (3D Book Cover in Book Details Modal & CR80 Live ID Card Preview) */
      .ulm-preserve-dark {
        background: linear-gradient(145deg, #0F172A 0%, #1E1B4B 55%, #2E1065 100%) !important;
        color: #F8FAFC !important;
        border-color: rgba(188, 136, 27, 0.55) !important;
      }
      html.light-theme .ulm-preserve-dark,
      html.light-theme .ulm-preserve-dark :is(h1, h2, h3, h4, h5, h6, p, span, div, label, strong, b, code) {
        color: #F8FAFC !important;
      }
      html.light-theme .ulm-preserve-dark .ulm-cover-gold,
      html.light-theme .ulm-preserve-dark [class*="text-amber-"],
      html.light-theme .ulm-preserve-dark [class*="text-royal-gold"] {
        color: #FDE68A !important;
      }
    </style>
  </head>
  <body class="antialiased selection:bg-amber-500/30 selection:text-amber-200 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
